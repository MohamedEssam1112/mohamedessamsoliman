<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السيرة الذاتية - محمد عصام</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #334155;
            border-radius: 16px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #38bdf8;
            margin-bottom: 20px;
        }
        h1 {
            margin: 10px 0 5px;
            font-size: 24px;
            color: #38bdf8;
        }
        p.title {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .info-section {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            text-align: right;
            margin-bottom: 20px;
        }
        .info-section h3 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 18px;
            border-bottom: 1px solid #475569;
            padding-bottom: 5px;
        }
        .info-section p {
            margin: 8px 0;
            font-size: 14px;
            color: #cbd5e1;
        }
        .btn {
            display: inline-block;
            background: #0284c7;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://i.postimg.cc/7Cvf6Pmp/image.jpg" alt="محمد عصام" class="profile-img">
        <h1>محمد عصام سليمان حسن سليمان</h1>
        <p class="title">طالب نظم معلومات إدارية (MIS)</p>
        
        <div class="info-section">
            <h3>البيانات الأكاديمية</h3>
            <p><strong>المعهد:</strong> معهد الدلتا العالي لنظم المعلومات والمحاسبة بالمنصورة</p>
            <p><strong>التخصص:</strong> نظم المعلومات الإدارية</p>
        </div>

        <a href="https://github.com/MohamedEssam1112" class="btn" target="_blank">حسابي على GitHub</a>
    </div>

</body>
</html>
